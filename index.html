<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login / Register</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 300px; }
  h2 { text-align: center; }
  input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #45a049; }
  .toggle { text-align: center; margin-top: 10px; cursor: pointer; color: #4CAF50; }
</style>
</head>
<body>
<div class="container">
  <div id="loginForm">
    <h2>Login</h2>
    <form action="login" method="post">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p class="toggle" onclick="show('register')">Don't have an account? Register</p>
  </div>

  <div id="registerForm" style="display:none;">
    <h2>Register</h2>
    <form action="register" method="post">
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>
    <p class="toggle" onclick="show('login')">Already have an account? Login</p>
  </div>
</div>

<script>
function show(form) {
  document.getElementById('loginForm').style.display = form === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = form === 'register' ? 'block' : 'none';
}
</script>
</body>
</html>
