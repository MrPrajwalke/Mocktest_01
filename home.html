<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f2f2f2; }
  header { background: #4CAF50; color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; }
  nav a { color: #fff; margin-left: 20px; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  .hero { text-align: center; padding: 60px 20px; }
  .hero h2 { font-size: 32px; }
  .hero p { color: #555; }
  .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #4CAF50; color: #fff; text-decoration: none; border-radius: 4px; }
  .btn:hover { background: #45a049; }
  footer { text-align: center; padding: 15px; background: #333; color: #fff; margin-top: 40px; }
</style>
</head>
<body>

<header>
  <h1>MyWebsite</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">

  <h2>Welcome to MyWebsite</h2>
  <p>This is a simple homepage built with plain HTML and CSS.</p>

  <a href="#" class="btn">Get Started</a>
</section>

<footer>
  <p>&copy; 2026 MyWebsite. All rights reserved.</p>
</footer>

</body>
</html>
